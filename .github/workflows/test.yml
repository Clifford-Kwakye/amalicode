name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Plugin
        working-directory: plugin
        run: |
          bun install --frozen-lockfile
          bun test
          bunx tsc -p .
      - name: Scripts
        run: |
          bash -n install.sh
          bash -n launcher/amalicode
          bash -n script/release.sh
